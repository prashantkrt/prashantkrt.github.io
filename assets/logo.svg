<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="ptBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a"/>
      <stop offset="60%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>

    <!-- Primary P Glyph Gradient -->
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#a1f4c2"/>
    </linearGradient>

    <!-- Secondary T Glyph Gradient -->
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>

    <radialGradient id="innerGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Base with Chamfered Squircle -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#ptBg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#innerGlow)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Architecture Microgrid Nodes -->
  <circle cx="12" cy="12" r="1.3" fill="#38bdf8" opacity="0.4"/>
  <circle cx="52" cy="12" r="1.3" fill="#00f5a0" opacity="0.4"/>
  <circle cx="12" cy="52" r="1.3" fill="#818cf8" opacity="0.4"/>
  <line x1="12" y1="12" x2="17" y2="12" stroke="#38bdf8" stroke-width="0.8" opacity="0.3"/>
  <line x1="47" y1="12" x2="52" y2="12" stroke="#00f5a0" stroke-width="0.8" opacity="0.3"/>

  <!-- P VERTICAL PILLAR: x=15 to 21.5 (width 6.5), y=14 to 50 -->
  <rect x="15" y="14" width="6.5" height="36" rx="3.25" fill="url(#pGrad)"/>

  <!-- T HORIZONTAL CROSSBAR: x=18 to 49 (width 31), y=14 to 20.5 (height 6.5) -->
  <path d="M 18 14 H 48.5 C 50.4 14 52 15.45 52 17.25 C 52 19.05 50.4 20.5 48.5 20.5 H 18 Z" fill="url(#tGrad)"/>

  <!-- P CONTINUOUS LOOP -->
  <path d="M 21.5 17.25 H 34 C 41.5 17.25 46.5 21.5 46.5 27 C 46.5 32.5 41.5 36.75 34 36.75 H 21.5" 
        stroke="url(#pGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- T VERTICAL STEM: x=32 to 38 (width 6), y=20.5 to 48 (height 27.5) -->
  <path d="M 32 20.5 H 38 V 46 C 38 47.65 36.65 49 35 49 C 33.35 49 32 47.65 32 46 Z" fill="url(#tGrad)"/>

  <!-- RADIANT DISTRIBUTED EVENT NEXUS / KAFKA CORE -->
  <circle cx="48" cy="46" r="4.5" fill="#00f5a0" filter="url(#coreGlow)"/>
  <circle cx="48" cy="46" r="2" fill="#04120a"/>
</svg>