<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Night Sky Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Glowing Cyber Emerald Border -->
    <linearGradient id="bearBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>

    <!-- Campfire Glow Filter -->
    <filter id="fireGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#nightSky)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" stroke="url(#bearBorder)" stroke-width="1.6"/>

  <!-- Starry Night Background (matching GitHub avatar) -->
  <circle cx="14" cy="12" r="0.8" fill="#fff" opacity="0.8"/>
  <circle cx="22" cy="8" r="0.6" fill="#fff" opacity="0.6"/>
  <circle cx="34" cy="11" r="0.7" fill="#fff" opacity="0.75"/>
  <circle cx="48" cy="9" r="0.8" fill="#fff" opacity="0.9"/>
  <circle cx="53" cy="16" r="0.6" fill="#fff" opacity="0.5"/>
  <circle cx="10" cy="22" r="0.7" fill="#fff" opacity="0.6"/>

  <!-- BEAR EARS -->
  <!-- Left Ear -->
  <circle cx="21" cy="21" r="7" fill="#222831"/>
  <circle cx="21" cy="21" r="4.2" fill="#E0A96D"/>
  <!-- Right Ear -->
  <circle cx="43" cy="21" r="7" fill="#222831"/>
  <circle cx="43" cy="21" r="4.2" fill="#E0A96D"/>

  <!-- BEAR HEAD -->
  <ellipse cx="32" cy="33" rx="16" ry="14" fill="#2B323C"/>

  <!-- SNOUT -->
  <ellipse cx="32" cy="37" rx="8" ry="6" fill="#E0A96D"/>
  <!-- Nose -->
  <path d="M 30 35 C 31 34 33 34 34 35 C 34.5 35.8 33 37 32 37 C 31 37 29.5 35.8 30 35 Z" fill="#1A1C20"/>
  <!-- Mouth -->
  <path d="M 32 37 V 39" stroke="#1A1C20" stroke-width="1" stroke-linecap="round"/>
  <path d="M 30 39 Q 32 41 34 39" stroke="#1A1C20" stroke-width="1" stroke-linecap="round" fill="none"/>

  <!-- BEAR EYES -->
  <ellipse cx="26" cy="31" rx="1.8" ry="2.2" fill="#111317"/>
  <circle cx="25.5" cy="30.2" r="0.6" fill="#fff"/>
  <ellipse cx="38" cy="31" rx="1.8" ry="2.2" fill="#111317"/>
  <circle cx="37.5" cy="30.2" r="0.6" fill="#fff"/>

  <!-- SIGNATURE MOON BEAR CRESCENT CHEST COLLAR (like GitHub profile) -->
  <path d="M 23 45 C 28 50 36 50 41 45 C 37 54 27 54 23 45 Z" fill="#F4CA89"/>

  <!-- CAMPFIRE WARMTH (from GitHub avatar) -->
  <circle cx="51" cy="49" r="4.5" fill="#FF7A00" filter="url(#fireGlow)"/>
  <circle cx="51" cy="49" r="2.2" fill="#FFDE59"/>
  <!-- Marshmallow Spark -->
  <circle cx="13" cy="49" r="2" fill="#00f5a0" filter="url(#fireGlow)"/>
</svg>